<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chai and code</title>
</head>
<body style="background-color: black; color: antiquewhite;">
    <ul class="language">
        <li>javascript</li>
    </ul>
</body>
<script>
    function addlan(langname){
        const li= document.createElement('li');
        li.innerHTML=`${langname}`
        document.querySelector('.language').appendChild(li)
    }
    addlan("python")
    addlan("typescript")

    function addoptilanguage(langname){
        const li = document.createElement('li')
        li.appendChild(document.createTextNode(langname))
        document.querySelector('.language').appendChild(li)
    }
    addoptilanguage("golang")

    //EDIT 1
    const seecondlang = document.querySelector("li:nth-child(2)")
    console.log(seecondlang);// give the second element of the list
    //seecondlang.innerHTML="mojo"// not efficient way to edit a element
   const newli = document.createElement('li')
   newli.textContent="mojo"
   seecondlang.replaceWith(newli)//optimized method in this is good

   //EDIT 2         
   const firstlang=document.querySelector("li:first-child")
   firstlang.outerHTML="<li>Typescript</li>"

   //REMOVE
   const lastlang=document.querySelector("li:last-child")
   lastlang.remove()
</script>
</html>
