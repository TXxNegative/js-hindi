        html,

            border-radius: 10px;
            display:inline-block;
            padding: 20px;
            border: 1px solid #125477;
            
        }
        
        input{
            display :block;
            padding: 10px;
        }
        
        
    </style>
</head>

<body>

    <div class="card">
