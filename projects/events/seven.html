<!DOCTYPE html>
<html lang="en">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0;
            padding:0;
            font-family: "gilroy-light",sans-serif;
            box-sizing: border-box;
        }
        html,
        body{
            width: 100%;
            height:100%;
            background-color: #222;
        }
        #btn{
            padding: 12px 22px;
            background-color: #37d429;
            color: #555;
            font-weight: 600;
            border-radius: 10px;
        }
        #btn:hover{
            background-color: #13470e;
        }
        #main{
            padding: 30px;
        }
        .card{
            max-width: 500px;
            margin-top: 40px;
            margin-left:30px;
            border-radius: 10px;
            display:inline-block;
            padding: 20px;
            border: 1px solid #125477;
            color: #fff;
        }
        .profile{
            width:100px;
            height: 100px;
            border-radius: 50%;
            margin-bottom: 10px;
            overflow:hidden; /*overflow :hidden is use to remove the excess part outside the div */
        } 
        input{
            display :block;
            padding: 10px;
        }
        .profile img{
            height: 100%;
            width: 100%;
            object-fit: cover;
        }
        .card h3{
            font-size: 40px;
        }
        .card h5{
            margin-top: 5px;
            font-size: 25px;
        }
        .card p{
            font-size: 20px;
            margin-top: 10px;
        }
        
    </style>
</head>

<body>
    <div id="main">
        <form action="">
            <!-- <input reqired type="text" placeholder="profile pic">  required is used for form validation. if we dont fill any input in input space then it will give us message  -->
            <input required minlength="3" type="text" placeholder="name">
            <input required type="text" placeholder="position">
            <input required type="text" placeholder="about">
            <input type="submit">
        </form>
    </div>
    

</body>
<script src="seven.js"></script>
</html>
