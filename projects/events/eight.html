<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mouseover & mousemove</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
        font-family: "gilroy-light",sans-serif;
        box-sizing: border-box;
    }
    html,body{
        width: 100%;
        height: 100%;
    }
    body{
        position:relative; 
        overflow: hidden;
    }/* it will stop the extension of web page */
     
    #ab{
        position:absolute;
        transition: cubic-bezier(0.19, 1, 0.22, 1);
        width: 100px;
        height: 100px;
        background-color: rgba(255,228,196,0.5);
        backdrop-filter: blur(1px); /*for translucent*/
        border-radius: 50%;
        border: solid 1px peru;
    }
    /* #ab:hover{ // hover method using css
        background-color: bisque;
    } */
     
</style>
<body>
    <div id="ab"></div>
    <p>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Consequatur eveniet autem soluta reprehenderit non quis nam quo magni mollitia voluptatum repudiandae, sint hic, dignissimos deserunt sapiente magnam eligendi doloribus cumque!</p>
</body>
<script src="eight.js"></script>
</html>
